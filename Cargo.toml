[package]
name = "bibsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Isaac C. F. Wong"]
description = "A Rust package to automatically resolve, synchronize, and validate LaTeX citations across BibTeX databases"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/isaac-cf-wong/bibsync"
homepage = "https://github.com/isaac-cf-wong/bibsync"
documentation = "https://isaac-cf-wong.github.io/bibsync"
keywords = ["bibtex", "latex", "arxiv", "ads", "inspirehep"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/docs/template_documentation"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
divan = "0.1"
predicates = "3.1"
tempfile = "3.23"

[lib]
name = "bibsync"
path = "src/lib.rs"

[[bin]]
name = "bibsync"
path = "src/main.rs"

[[bench]]
name = "greeting"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "warn"
