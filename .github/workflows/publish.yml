name: Publish

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string
            publish:
                description: "Publish to crates.io"
                required: true
                default: false
                type: boolean
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string
            publish:
                description: "Publish to crates.io"
                required: false
                default: false
                type: boolean

env:
    # Template safety switch. Change this to `true` in a real package after
    # configuring the `crates-io` environment and a crates.io trusted publisher.
    PUBLISH_TO_CRATES_IO: "true"

jobs:
    verify:
        runs-on: ubuntu-latest
        outputs:
            publish_enabled: ${{ steps.publish_gate.outputs.enabled }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Verify crate version matches tag
              run: |
                  EXPECTED_VERSION="${{ inputs.tag_name }}"
                  EXPECTED_VERSION="${EXPECTED_VERSION#v}"
                  ACTUAL_VERSION=$(
                    cargo metadata --no-deps --format-version 1 |
                      python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
                  )
                  if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
                    echo "Cargo.toml version $ACTUAL_VERSION does not match tag ${{ inputs.tag_name }}." >&2
                    exit 1
                  fi

            - name: Verify package
              run: cargo package

            - name: Evaluate publish gate
              id: publish_gate
              run: |
                  if [ "${PUBLISH_TO_CRATES_IO}" = "true" ] && [ "${{ inputs.publish }}" = "true" ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Skip publish
              if: ${{ steps.publish_gate.outputs.enabled != 'true' }}
              run: |
                  echo "Publishing is disabled for this template." >> "$GITHUB_STEP_SUMMARY"
                  echo "Set PUBLISH_TO_CRATES_IO to true and pass publish=true to enable crates.io publishing." >> "$GITHUB_STEP_SUMMARY"

    publish:
        needs: verify
        if: ${{ needs.verify.outputs.publish_enabled == 'true' }}
        runs-on: ubuntu-latest
        environment: crates-io
        # crates.io trusted publishing exchanges the job's OIDC token for a
        # short-lived publish token. crates.io matches the token against the
        # top-level workflow, so register both publish.yml (manual dispatch) and
        # scheduled_release.yml (which calls this workflow) as trusted publishers.
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Verify crate version matches tag
              run: |
                  EXPECTED_VERSION="${{ inputs.tag_name }}"
                  EXPECTED_VERSION="${EXPECTED_VERSION#v}"
                  ACTUAL_VERSION=$(
                    cargo metadata --no-deps --format-version 1 |
                      python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
                  )
                  if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
                    echo "Cargo.toml version $ACTUAL_VERSION does not match tag ${{ inputs.tag_name }}." >&2
                    exit 1
                  fi

            - name: Authenticate with crates.io
              id: crates_io_auth
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

            - name: Publish crate
              run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
