name: Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the release (e.g., v1.2.3)"
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the release (e.g., v1.2.3)"
                required: true
                type: string

permissions:
    contents: write
    id-token: write

env:
    CARGO_NET_RETRY: 10

jobs:
    build-binaries:
        name: Build binary (${{ matrix.os }} ${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      os: linux
                      arch: x86_64
                      binary: bibsync
                      archive: tar.gz
                    - runner: ubuntu-24.04-arm
                      os: linux
                      arch: aarch64
                      binary: bibsync
                      archive: tar.gz
                    - runner: macos-latest
                      os: macos
                      arch: x86_64
                      target: x86_64-apple-darwin
                      binary: bibsync
                      archive: tar.gz
                    - runner: macos-latest
                      os: macos
                      arch: aarch64
                      binary: bibsync
                      archive: tar.gz
                    - runner: windows-latest
                      os: windows
                      arch: x86_64
                      binary: bibsync.exe
                      archive: zip
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

            - name: Build binary
              run: cargo build --release --locked --bin bibsync ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

            - name: Package binary
              shell: bash
              run: |
                  tag="${{ inputs.tag_name || github.event.inputs.tag_name }}"
                  package="bibsync-${tag}-${{ matrix.os }}-${{ matrix.arch }}"
                  mkdir -p "dist/$package"
                  binary_path="${{ matrix.target && format('target/{0}/release/{1}', matrix.target, matrix.binary) || format('target/release/{0}', matrix.binary) }}"
                  cp "$binary_path" "dist/$package/"
                  cp README.md LICENSE "dist/$package/"
                  if [ "${{ matrix.archive }}" = "zip" ]; then
                    (cd "dist/$package" && 7z a "../$package.zip" .)
                  else
                    tar -C "dist/$package" -czf "dist/$package.tar.gz" .
                  fi

            - name: Upload binary artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibsync-${{ matrix.os }}-${{ matrix.arch }}
                  path: |
                      dist/*.tar.gz
                      dist/*.zip
                  if-no-files-found: error

    build-python-wheels:
        name: Build Python wheel (${{ matrix.os }} ${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      os: linux
                      arch: x86_64
                      target: x86_64
                    - runner: ubuntu-24.04-arm
                      os: linux
                      arch: aarch64
                      target: aarch64
                    - runner: macos-latest
                      os: macos
                      arch: x86_64
                      target: x86_64
                    - runner: macos-latest
                      os: macos
                      arch: aarch64
                      target: aarch64
                    - runner: windows-latest
                      os: windows
                      arch: x86_64
                      target: x64
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: auto
                  sccache: true

            - name: Upload wheel artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibsync-python-${{ matrix.os }}-${{ matrix.arch }}
                  path: dist/*.whl
                  if-no-files-found: error

    build-python-sdist:
        name: Build Python source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibsync-python-sdist
                  path: dist/*.tar.gz
                  if-no-files-found: error

    publish-pypi:
        name: Publish Python package to PyPI
        needs: [build-python-wheels, build-python-sdist]
        runs-on: ubuntu-latest
        environment: pypi
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: "3.13"
                  enable-cache: "false"

            - name: Download Python artifacts
              uses: actions/download-artifact@v7
              with:
                  pattern: bibsync-python-*
                  path: dist
                  merge-multiple: true

            - name: List Python artifacts
              run: find dist -maxdepth 2 -type f -print | sort

            - name: Publish to PyPI
              run: uv publish --trusted-publishing automatic dist/*

    release:
        needs: [build-binaries, build-python-wheels, build-python-sdist]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

            - name: Generate changelog
              id: changelog
              uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
              with:
                  config: cliff.toml
                  args: --current --verbose
              env:
                  OUTPUT: CHANGELOG.md

            - name: Delete draft release
              continue-on-error: true
              run: |
                  gh release delete next-release --yes
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Download binary artifacts
              uses: actions/download-artifact@v7
              with:
                  path: dist
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  tag_name: ${{ inputs.tag_name || github.event.inputs.tag_name }}
                  body: ${{ steps.changelog.outputs.content }}
                  draft: false
                  prerelease: ${{ contains(inputs.tag_name || github.event.inputs.tag_name, 'alpha') || contains(inputs.tag_name || github.event.inputs.tag_name, 'beta') }}
                  files: |
                      dist/*.tar.gz
                      dist/*.zip
