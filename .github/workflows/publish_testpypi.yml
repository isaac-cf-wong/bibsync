name: Publish to TestPyPI

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: false
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: false
                type: string

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.sha }}
                  fetch-depth: 0

            - name: Output build information
              run: |
                  echo "### Publishing Build :package:" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Version tag**: ${{ inputs.tag_name || github.sha }}" >> "$GITHUB_STEP_SUMMARY"

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: "3.13"
                  enable-cache: "true"

            - name: Install dependencies
              run: uv sync --group build --frozen

            - name: Set version for publishing
              run: |
                  if [ -n "${{ inputs.tag_name }}" ]; then
                    VERSION=$(echo "${{ inputs.tag_name }}" | sed 's/^v//')
                  else
                    BASE_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
                    DEV_NUMBER=$((${{ github.run_number }} * 100 + ${{ github.run_attempt }}))
                    VERSION="${BASE_VERSION}-dev.${DEV_NUMBER}"
                  fi

                  VERSION="$VERSION" python3 - <<'PY'
                  import os
                  from pathlib import Path

                  version = os.environ["VERSION"]
                  cargo_toml = Path("Cargo.toml")
                  lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)

                  in_package = False
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped == "[package]":
                          in_package = True
                          continue
                      if in_package and stripped.startswith("["):
                          break
                      if in_package and stripped.startswith("version = "):
                          newline = "\n" if line.endswith("\n") else ""
                          lines[index] = f'version = "{version}"{newline}'
                          cargo_toml.write_text("".join(lines), encoding="utf-8")
                          break
                  else:
                      raise SystemExit("Could not find [package] version in Cargo.toml")
                  PY

            - name: Build distribution
              run: uv build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: python-package-distributions
                  path: dist/

    publish-to-testpypi:
        needs: build
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
            id-token: write

        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: "3.13"
                  enable-cache: "true"

            - name: Download build artifacts
              uses: actions/download-artifact@v7
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to TestPyPI
              run: uv publish --trusted-publishing automatic --publish-url https://test.pypi.org/legacy/ dist/*
