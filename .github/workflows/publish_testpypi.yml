name: Publish to TestPyPI

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: false
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: false
                type: string

env:
    CARGO_NET_RETRY: 10

jobs:
    build-python-wheels:
        name: Build Python wheel (${{ matrix.os }} ${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      os: linux
                      arch: x86_64
                      target: x86_64
                    - runner: ubuntu-24.04-arm
                      os: linux
                      arch: aarch64
                      target: aarch64
                    - runner: macos-latest
                      os: macos
                      arch: x86_64
                      target: x86_64
                    - runner: macos-latest
                      os: macos
                      arch: aarch64
                      target: aarch64
                    - runner: windows-latest
                      os: windows
                      arch: x86_64
                      target: x64
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.sha }}
                  fetch-depth: 0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

            - name: Output build information
              run: |
                  echo "### Publishing Build :package:" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Version tag**: ${{ inputs.tag_name || github.sha }}" >> "$GITHUB_STEP_SUMMARY"

            - name: Set version for publishing
              shell: bash
              run: |
                  if [ -n "${{ inputs.tag_name }}" ]; then
                    VERSION=$(echo "${{ inputs.tag_name }}" | sed 's/^v//')
                  else
                    DEV_NUMBER=$((${{ github.run_number }} * 100 + ${{ github.run_attempt }}))
                    VERSION_SUFFIX="-dev.${DEV_NUMBER}"
                  fi

                  VERSION="${VERSION:-}" VERSION_SUFFIX="${VERSION_SUFFIX:-}" python3 - <<'PY'
                  import os
                  from pathlib import Path

                  cargo_toml = Path("Cargo.toml")
                  lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)

                  in_package = False
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped == "[package]":
                          in_package = True
                          continue
                      if in_package and stripped.startswith("["):
                          break
                      if in_package and stripped.startswith("version = "):
                          current = stripped.split('"', 2)[1]
                          version = os.environ["VERSION"] or f"{current}{os.environ['VERSION_SUFFIX']}"
                          newline = "\n" if line.endswith("\n") else ""
                          lines[index] = f'version = "{version}"{newline}'
                          cargo_toml.write_text("".join(lines), encoding="utf-8")
                          break
                  else:
                      raise SystemExit("Could not find [package] version in Cargo.toml")
                  PY

            - name: Build wheel
              uses: PyO3/maturin-action@v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: auto
                  sccache: true

            - name: Upload wheel artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibsync-testpypi-${{ matrix.os }}-${{ matrix.arch }}
                  path: dist/*.whl
                  if-no-files-found: error

    build-python-sdist:
        name: Build Python source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  ref: ${{ inputs.tag_name || github.sha }}
                  fetch-depth: 0

            - name: Cache Cargo
              uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

            - name: Set version for publishing
              run: |
                  if [ -n "${{ inputs.tag_name }}" ]; then
                    VERSION=$(echo "${{ inputs.tag_name }}" | sed 's/^v//')
                  else
                    DEV_NUMBER=$((${{ github.run_number }} * 100 + ${{ github.run_attempt }}))
                    VERSION_SUFFIX="-dev.${DEV_NUMBER}"
                  fi

                  VERSION="${VERSION:-}" VERSION_SUFFIX="${VERSION_SUFFIX:-}" python3 - <<'PY'
                  import os
                  from pathlib import Path

                  cargo_toml = Path("Cargo.toml")
                  lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)

                  in_package = False
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped == "[package]":
                          in_package = True
                          continue
                      if in_package and stripped.startswith("["):
                          break
                      if in_package and stripped.startswith("version = "):
                          current = stripped.split('"', 2)[1]
                          version = os.environ["VERSION"] or f"{current}{os.environ['VERSION_SUFFIX']}"
                          newline = "\n" if line.endswith("\n") else ""
                          lines[index] = f'version = "{version}"{newline}'
                          cargo_toml.write_text("".join(lines), encoding="utf-8")
                          break
                  else:
                      raise SystemExit("Could not find [package] version in Cargo.toml")
                  PY

            - name: Build sdist
              uses: PyO3/maturin-action@v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist artifact
              uses: actions/upload-artifact@v6
              with:
                  name: bibsync-testpypi-sdist
                  path: dist/*.tar.gz
                  if-no-files-found: error

    publish-to-testpypi:
        needs: [build-python-wheels, build-python-sdist]
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
            id-token: write

        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: "3.13"
                  enable-cache: "true"

            - name: Download build artifacts
              uses: actions/download-artifact@v7
              with:
                  pattern: bibsync-testpypi-*
                  path: dist
                  merge-multiple: true

            - name: Publish to TestPyPI
              run: uv publish --trusted-publishing automatic --publish-url https://test.pypi.org/legacy/ dist/*
