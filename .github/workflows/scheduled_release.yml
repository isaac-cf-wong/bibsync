name: Scheduled Release

on:
    schedule:
        - cron: "0 0 * * 2"
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

env:
    CARGO_NET_RETRY: 10

jobs:
    check_new_commits:
        runs-on: ubuntu-latest
        outputs:
            has-changes: ${{ steps.check_commits.outputs.has-changes }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0

            - name: Check for new commits
              id: check_commits
              uses: isaac-cf-wong/detect-git-changes-action@604bb375bf2cef3116a2505f30cc6c5965a8fcba # v0.0.18
              with:
                  use-latest-tag: true

    ci:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        uses: ./.github/workflows/ci.yml

    codeql:
        needs: check_new_commits
        if: ${{ needs.check_new_commits.outputs.has-changes == 'true' }}
        uses: ./.github/workflows/codeql.yml
        permissions:
            security-events: write
            packages: read
            actions: read
            contents: read

    create_tag:
        needs: [ci, codeql]
        runs-on: ubuntu-latest
        outputs:
            new_tag: ${{ steps.tag_version.outputs.new_tag }}
            new_version: ${{ steps.tag_version.outputs.new_version }}
        steps:
            - name: Create release GitHub App token
              id: release_app_token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  app-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  token: ${{ steps.release_app_token.outputs.token }}

            - name: Get release GitHub App user ID
              id: release_app_user
              run: echo "user_id=$(gh api "/users/${{ steps.release_app_token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ steps.release_app_token.outputs.token }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  toolchain: stable

            - name: Check previous tag
              id: previous_tag
              run: |
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
                  echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
                  if [ "$PREVIOUS_TAG" = "none" ]; then
                    echo "has_previous_tag=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_previous_tag=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Determine release version
              if: ${{ steps.previous_tag.outputs.has_previous_tag == 'true' }}
              id: release_version
              uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
              with:
                  config: cliff.toml
                  args: --bumped-version

            - name: Bump crate version and push tag
              id: tag_version
              env:
                  PREVIOUS_TAG: ${{ steps.previous_tag.outputs.previous_tag }}
                  RELEASE_VERSION: ${{ steps.release_version.outputs.content }}
              run: |
                  if [ "$PREVIOUS_TAG" = "none" ]; then
                    NEW_TAG="v0.1.0"
                  else
                    NEW_TAG="$(printf '%s' "$RELEASE_VERSION" | tr -d '[:space:]')"
                  fi
                  if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
                    echo "Creating annotated tag $NEW_TAG"

                    git config user.name "${{ steps.release_app_token.outputs.app-slug }}[bot]"
                    git config user.email "${{ steps.release_app_user.outputs.user_id }}+${{ steps.release_app_token.outputs.app-slug }}[bot]@users.noreply.github.com"

                    NEW_VERSION="${NEW_TAG#v}"
                    NEW_VERSION="$NEW_VERSION" python3 - <<'PY'
                  import os
                  import re
                  from pathlib import Path

                  version = os.environ["NEW_VERSION"]

                  cargo_toml = Path("Cargo.toml")
                  lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)

                  in_package = False
                  updated = False
                  for index, line in enumerate(lines):
                      stripped = line.strip()
                      if stripped == "[package]":
                          in_package = True
                          continue
                      if in_package and stripped.startswith("["):
                          break
                      if in_package and stripped.startswith("version = "):
                          newline = "\n" if line.endswith("\n") else ""
                          lines[index] = f'version = "{version}"{newline}'
                          updated = True
                          break

                  if not updated:
                      raise SystemExit("Could not find [package] version in Cargo.toml")

                  cargo_toml.write_text("".join(lines), encoding="utf-8")

                  readme = Path("README.md")
                  readme_text = readme.read_text(encoding="utf-8")
                  readme_text = re.sub(
                      r"(?m)^(\s+rev:\s+)v[\d.]+",
                      rf"\g<1>v{version}",
                      readme_text,
                  )
                  readme_text = re.sub(
                      r"(?m)^(\s+version = \{)v[\d.]+(\},)",
                      rf"\g<1>v{version}\2",
                      readme_text,
                  )
                  import datetime
                  today = datetime.date.today()
                  readme_text = re.sub(
                      r"(?m)^(\s+year\s+=\s+\{)\d{4}(\},)",
                      rf"\g<1>{today.year}\2",
                      readme_text,
                  )
                  month_abbr = today.strftime("%b").lower()
                  readme_text = re.sub(
                      r"(?m)^(\s+month\s+=\s+)[a-z]+",
                      rf"\g<1>{month_abbr}",
                      readme_text,
                  )
                  readme.write_text(readme_text, encoding="utf-8")

                  today_iso = today.isoformat()

                  citation = Path("CITATION.cff")
                  citation_text = citation.read_text(encoding="utf-8")
                  citation_text = re.sub(
                      r'(?m)^(version:\s+)"[\d.]+"',
                      rf'\g<1>"{version}"',
                      citation_text,
                  )
                  citation_text = re.sub(
                      r'(?m)^(date-released:\s+)"\d{4}-\d{2}-\d{2}"',
                      rf'\g<1>"{today_iso}"',
                      citation_text,
                  )
                  citation.write_text(citation_text, encoding="utf-8")
                  PY
                    cargo generate-lockfile

                    if ! git diff --quiet -- Cargo.toml Cargo.lock README.md CITATION.cff; then
                      git add Cargo.toml Cargo.lock README.md CITATION.cff
                      git commit -m "chore(release): prepare for $NEW_TAG [skip ci]"
                      git push origin "HEAD:${GITHUB_REF_NAME}"
                    else
                      echo "Cargo.toml and Cargo.lock already match $NEW_TAG"
                    fi

                    git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
                    git push origin "$NEW_TAG"
                  else
                    echo "Tag $NEW_TAG already exists, skipping."
                    exit 1
                  fi
                  echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
                  echo "new_version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

            - name: Output tag information
              run: |
                  echo "### Tag Created" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **New tag**: ${{ steps.tag_version.outputs.new_tag }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Crate version**: ${{ steps.tag_version.outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
                  echo "- **Previous tag**: ${{ steps.tag_version.outputs.previous_tag }}" >> "$GITHUB_STEP_SUMMARY"

    build-binaries:
        name: Build binary (${{ matrix.os }} ${{ matrix.arch }})
        needs: create_tag
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      os: linux
                      arch: x86_64
                      binary: bibsync
                      archive: tar.gz
                    - runner: ubuntu-24.04-arm
                      os: linux
                      arch: aarch64
                      binary: bibsync
                      archive: tar.gz
                    - runner: macos-latest
                      os: macos
                      arch: x86_64
                      target: x86_64-apple-darwin
                      binary: bibsync
                      archive: tar.gz
                    - runner: macos-latest
                      os: macos
                      arch: aarch64
                      binary: bibsync
                      archive: tar.gz
                    - runner: windows-latest
                      os: windows
                      arch: x86_64
                      binary: bibsync.exe
                      archive: zip
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ needs.create_tag.outputs.new_tag }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with:
                  toolchain: stable
                  targets: ${{ matrix.target }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Build binary
              run: cargo build --release --locked --bin bibsync ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

            - name: Package binary
              shell: bash
              run: |
                  tag="${{ needs.create_tag.outputs.new_tag }}"
                  package="bibsync-${tag}-${{ matrix.os }}-${{ matrix.arch }}"
                  mkdir -p "dist/$package"
                  binary_path="${{ matrix.target && format('target/{0}/release/{1}', matrix.target, matrix.binary) || format('target/release/{0}', matrix.binary) }}"
                  cp "$binary_path" "dist/$package/"
                  cp README.md LICENSE "dist/$package/"
                  if [ "${{ matrix.archive }}" = "zip" ]; then
                    (cd "dist/$package" && 7z a "../$package.zip" .)
                  else
                    tar -C "dist/$package" -czf "dist/$package.tar.gz" .
                  fi

            - name: Upload binary artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: bibsync-${{ matrix.os }}-${{ matrix.arch }}
                  path: |
                      dist/*.tar.gz
                      dist/*.zip
                  if-no-files-found: error

    build-python-wheels:
        name: Build Python wheel (${{ matrix.os }} ${{ matrix.arch }})
        needs: create_tag
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-latest
                      os: linux
                      arch: x86_64
                      target: x86_64
                    - runner: ubuntu-24.04-arm
                      os: linux
                      arch: aarch64
                      target: aarch64
                    - runner: macos-latest
                      os: macos
                      arch: x86_64
                      target: x86_64
                    - runner: macos-latest
                      os: macos
                      arch: aarch64
                      target: aarch64
                    - runner: windows-latest
                      os: windows
                      arch: x86_64
                      target: x64
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ needs.create_tag.outputs.new_tag }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Build wheels
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
              with:
                  target: ${{ matrix.target }}
                  args: --release --out dist
                  manylinux: auto
                  sccache: true

            - name: Upload wheel artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: bibsync-python-${{ matrix.os }}-${{ matrix.arch }}
                  path: dist/*.whl
                  if-no-files-found: error

    build-python-sdist:
        name: Build Python source distribution
        needs: create_tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ needs.create_tag.outputs.new_tag }}

            - name: Cache Cargo
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Build sdist
              uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
              with:
                  command: sdist
                  args: --out dist

            - name: Upload sdist artifact
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: bibsync-python-sdist
                  path: dist/*.tar.gz
                  if-no-files-found: error

    publish-pypi:
        name: Publish Python package to PyPI
        needs: [build-python-wheels, build-python-sdist]
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
            contents: read
            actions: read
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: "3.13"
                  enable-cache: "false"

            - name: Download Python artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  pattern: bibsync-python-*
                  path: dist
                  merge-multiple: true

            - name: List Python artifacts
              run: find dist -maxdepth 2 -type f -print | sort

            - name: Publish to PyPI
              run: uv publish --trusted-publishing automatic dist/*

    release:
        needs: [create_tag, build-binaries, build-python-wheels, build-python-sdist]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  ref: ${{ needs.create_tag.outputs.new_tag }}

            - name: Generate changelog
              id: changelog
              uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
              with:
                  config: cliff.toml
                  args: --current --verbose
              env:
                  OUTPUT: CHANGELOG.md

            - name: Delete draft release
              continue-on-error: true
              run: |
                  gh release delete next-release --yes
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Download release artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  path: dist
                  merge-multiple: true

            - name: Create Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  tag_name: ${{ needs.create_tag.outputs.new_tag }}
                  body: ${{ steps.changelog.outputs.content }}
                  draft: false
                  prerelease: ${{ contains(needs.create_tag.outputs.new_tag, 'alpha') || contains(needs.create_tag.outputs.new_tag, 'beta') }}
                  files: |
                      dist/*.tar.gz
                      dist/*.zip

    publish:
        needs: [create_tag, release]
        uses: ./.github/workflows/publish.yml
        secrets: inherit
        with:
            tag_name: ${{ needs.create_tag.outputs.new_tag }}
            # Template safety switch. Change to `true` in a real package after
            # configuring the `crates-io` environment and `CARGO_REGISTRY_TOKEN`.
            publish: true
