name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

env:
    CARGO_TERM_COLOR: always

jobs:
    python:
        strategy:
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: "true"

            - name: Install Python dependencies
              run: uv sync --group dev --frozen

            - name: Run Python tests
              run: uv run --frozen pytest

    rust:
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable
                  components: clippy,rustfmt

            # The python feature links libpython into the test binaries, so pin the
            # interpreter instead of relying on whatever the runner image ships.
            # Exporting PYO3_PYTHON also makes pyo3 re-run its build script rather
            # than reuse a cached config from a different runner image.
            - name: Install Python
              id: python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: "3.12"

            - name: Point pyo3 at the installed Python
              shell: bash
              run: echo "PYO3_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run tests
              run: cargo test --all-features

            - name: Build docs
              run: cargo doc --no-deps --all-features

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Install cargo-audit
              run: cargo install cargo-audit --locked

            - name: Audit dependencies
              run: cargo audit
