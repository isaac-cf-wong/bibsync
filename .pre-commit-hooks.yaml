- id: bibsync
  name: bibsync
  description: Synchronize BibTeX entries from TeX citation keys
  entry: bibsync --check
  language: rust
  types_or: [tex, bib]
- id: bibsync-bin
  name: bibsync
  description: Synchronize BibTeX entries using a pre-built release binary
  entry: scripts/pre-commit-bibsync
  language: script
  types_or: [tex, bib]
